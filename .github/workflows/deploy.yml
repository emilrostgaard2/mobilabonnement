name: Upload telemobil.dk til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: '12 4,16 * * *'
  workflow_dispatch:
concurrency:
  group: deploy-telemobil
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent priser fra Adtraction
        env:
          ADTRACTION_CHANNEL_ID: ${{ secrets.ADTRACTION_CHANNEL_ID }}
        run: python3 _build/adtraction.py

      - name: Hent bredbaandspriser fra Adtraction
        env:
          ADTRACTION_CHANNEL_ID: ${{ secrets.ADTRACTION_CHANNEL_ID }}
        # Faejler bredbaandsfeedet, skal mobilsiderne stadig kunne bygges.
        continue-on-error: true
        run: python3 _build/bredbaand.py

      - name: Byg siderne
        run: python3 _build/build.py

      - name: Validér
        run: python3 _build/validate.py

      - name: Upload med lftp
        timeout-minutes: 20
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 20;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            set xfer:clobber true;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob _build/ \
              --exclude-glob data/ \
              --exclude-glob .gitignore \
              --exclude-glob '*.md' \
              ./ public_html/;
          "

      # Kun prisdata gemmes i repoet. De byggede HTML-sider hoerer ikke hjemme
      # i git — de genskabes ved hver koersel. Da robotten committede dem med
      # "git add -A", opstod der konflikt hver gang et menneske ogsaa arbejdede
      # i mappen. Det var aarsagen til alle merge-konflikterne.
      - name: Gem opdaterede priser i repoet
        run: |
          git config user.name "telemobil-bot"
          git config user.email "bot@telemobil.dk"

          # Kun de filer robotten faktisk producerer data i
          git add -- data/abonnementer.json
          if [ -f data/prishistorik.json ]; then
            git add -- data/prishistorik.json
          fi
          # Fingeraftryk pr. side. Uden den her nulstilles sitemappets lastmod
          # ved hver koersel, og alle sider ser ud til at aendre sig dagligt.
          if [ -f data/sidehistorik.json ]; then
            git add -- data/sidehistorik.json
          fi
          if [ -f data/bredbaand.json ]; then
            git add -- data/bredbaand.json
          fi

          if git diff --staged --quiet; then
            echo "Ingen prisaendringer — intet at gemme."
            exit 0
          fi

          git commit -m "Priser opdateret $(date -u +%Y-%m-%d\ %H:%M)"

          # Hent hvad der maatte vaere kommet til imens, og laeg vores commit
          # ovenpaa. Uden det fejler push, hvis to koersler overlapper.
          for forsoeg in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Forsoeg $forsoeg mislykkedes — proever igen om 5 sekunder"
            sleep 5
          done
          echo "Kunne ikke gemme priserne efter tre forsoeg."
          exit 1
