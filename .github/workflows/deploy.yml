name: Upload telemobil.dk til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: '12 4,16 * * *'
  workflow_dispatch:
concurrency:
  group: deploy-telemobil
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent priser fra Adtraction
        env:
          ADTRACTION_CHANNEL_ID: ${{ secrets.ADTRACTION_CHANNEL_ID }}
        run: python3 _build/adtraction.py
      - name: Byg siderne
        run: python3 _build/build.py
      - name: Validér
        run: python3 _build/validate.py
      - name: Upload med lftp
        timeout-minutes: 20
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 15;
            set net:reconnect-interval-base 4;
            set mirror:parallel-transfer-count 8;
            set xfer:clobber true;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob _build/ \
              --exclude-glob data/ \
              --exclude-glob .gitignore \
              --exclude-glob '*.md' \
              ./ public_html/;
          "
      - name: Gem opdaterede priser i repoet
        run: |
          git config user.name "telemobil-bot"
          git config user.email "bot@telemobil.dk"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Priser opdateret $(date -u +%Y-%m-%d\ %H:%M)"
          git push
